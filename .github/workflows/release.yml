name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release channel
        id: meta
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          $refName = $env:GITHUB_REF_NAME
          $event = $env:GITHUB_EVENT_NAME

          if ($ref -match '^refs/tags/v.+') {
            $releaseTag = $refName
            $releaseName = $refName
            $isPre = $refName -match '-'
            $prerelease = if ($isPre) { 'true' } else { 'false' }
            $makeLatest = if ($isPre) { 'false' } else { 'true' }
          }
          elseif ($event -eq 'workflow_dispatch' -and $refName -eq 'dev') {
            $releaseTag = 'dev'
            $releaseName = 'Dev'
            $prerelease = 'true'
            $makeLatest = 'false'
          }
          else {
            throw "Stable releases need a v* tag. Dev releases: run this workflow from the 'dev' branch."
          }

          if ($releaseTag -notmatch '^(dev|v[0-9][0-9A-Za-z.-]*)$') {
            throw "Refusing unsafe release tag: $releaseTag"
          }

          "release_tag=$releaseTag" | Add-Content $env:GITHUB_OUTPUT
          "release_name=$releaseName" | Add-Content $env:GITHUB_OUTPUT
          "prerelease=$prerelease" | Add-Content $env:GITHUB_OUTPUT
          "make_latest=$makeLatest" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "Publishing $releaseName (tag=$releaseTag, prerelease=$prerelease, make_latest=$makeLatest)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build pyinstaller pytest

      - name: Install package
        run: python -m pip install .

      - name: Run tests
        run: python -m pytest -q

      - name: Create PyInstaller entry point
        shell: pwsh
        run: |
          @(
            'from win_search_aliases.ui.gui import main'
            ''
            'raise SystemExit(main())'
          ) | Set-Content -LiteralPath pyinstaller_entry.py -Encoding UTF8

      - name: Build Windows UI executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --icon assets/app.ico
          --name win-search-aliases-ui-${{ steps.meta.outputs.release_tag }}
          --collect-data win_search_aliases
          --exclude-module _hashlib
          --exclude-module _ssl
          --exclude-module ssl
          pyinstaller_entry.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\win-search-aliases-ui-${{ steps.meta.outputs.release_tag }}.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Built executable was not found: $exe"
          }
          Get-Item -LiteralPath $exe | Format-List Name,Length,FullName

      - name: Smoke test executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\win-search-aliases-ui-${{ steps.meta.outputs.release_tag }}.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Executable smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Build Python install asset
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          Push-Location $env:RUNNER_TEMP
          try {
            python -m build $env:GITHUB_WORKSPACE --sdist --outdir $dist
          }
          finally {
            Pop-Location
          }

          $sdist = @(Get-ChildItem -LiteralPath $dist -Filter '*.tar.gz')
          if ($sdist.Count -ne 1) { throw "Expected 1 sdist, found $($sdist.Count)" }
          Move-Item -LiteralPath $sdist[0].FullName -Destination (Join-Path $dist 'win-search-aliases-python.tar.gz') -Force
          Get-Item -LiteralPath 'dist\win-search-aliases-python.tar.gz' | Format-List Name,Length,FullName

      - name: Verify Python install asset
        shell: pwsh
        run: |
          $installHome = Join-Path $env:RUNNER_TEMP 'release-python-asset-smoke'
          python -m venv $installHome

          $venvPython = Join-Path $installHome 'Scripts\python.exe'
          & $venvPython -m pip install --upgrade 'dist\win-search-aliases-python.tar.gz'

          $command = Join-Path $installHome 'Scripts\win-search-aliases.exe'
          $uiCommand = Join-Path $installHome 'Scripts\win-search-aliases-ui.exe'
          if (-not (Test-Path -LiteralPath $command)) {
            throw "Installed command was not found: $command"
          }
          if (-not (Test-Path -LiteralPath $uiCommand)) {
            throw "Installed UI command was not found: $uiCommand"
          }

          & $command --help

      - name: Pin installer to this release
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^(dev|v[0-9][0-9A-Za-z.-]*)$') {
            throw "Refusing to pin installer to unsafe release tag: $tag"
          }
          $escapedTag = $tag.Replace("'", "''")
          $path = Join-Path $env:GITHUB_WORKSPACE 'install.ps1'
          $content = [System.IO.File]::ReadAllText($path)
          $pattern = "`$ReleaseTag = 'latest'"
          if (-not $content.Contains($pattern)) {
            throw "Could not find `$ReleaseTag = 'latest' in install.ps1"
          }
          $updated = $content.Replace($pattern, "`$ReleaseTag = '$escapedTag'")
          [System.IO.File]::WriteAllText($path, $updated)
          Write-Host "Pinned installer ReleaseTag to $tag"

      - uses: actions/upload-artifact@v4
        with:
          name: win-search-aliases-ui-${{ steps.meta.outputs.release_tag }}-windows
          path: |
            dist/win-search-aliases-ui-${{ steps.meta.outputs.release_tag }}.exe
            dist/win-search-aliases-python.tar.gz
            install.ps1

      - name: Move rolling dev tag
        if: steps.meta.outputs.release_tag == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $refUri = "https://api.github.com/repos/$repo/git/refs/tags/dev"
          $response = Invoke-WebRequest -Uri $refUri -Headers $headers -Method Get -SkipHttpErrorCheck
          switch ([int]$response.StatusCode) {
            200 {
              Invoke-RestMethod -Uri $refUri -Headers $headers -Method Patch -ContentType 'application/json' -Body (@{
                sha = $sha
                force = $true
              } | ConvertTo-Json)
            }
            404 {
              Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/refs" -Headers $headers -Method Post -ContentType 'application/json' -Body (@{
                ref = 'refs/tags/dev'
                sha = $sha
              } | ConvertTo-Json)
            }
            default {
              throw "Failed to read refs/tags/dev: HTTP $($response.StatusCode) $($response.Content)"
            }
          }
          Write-Host "refs/tags/dev -> $sha"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          overwrite_files: true
          files: |
            dist/win-search-aliases-ui-${{ steps.meta.outputs.release_tag }}.exe
            dist/win-search-aliases-python.tar.gz
            install.ps1
