exact = []
patterns = [
  "*manual*",
  "*documentation*",
  "*docs*",
  "*help*",
  "history",
  "*support*",
  "*tutorial*",
  "*readme*",
  "*read me*",
  "*license*",
  "*privacy policy*",
  "samples*",
  "*terms of use*",
  "*install*",
  "*uninstall*",
  "*видалити*",
  "*деинсталлировать*",
  "*деінсталювати*",
  "*удалить*",
]
network_patterns = [
  "http://*",
  "https://*",
  "\\\\*" # Network resources
]
extensions = [
  ".pdf",
  ".txt",
  ".url",
  ".chm",
  ".doc",
  ".docx",
  ".rtf",
  ".html",
  ".htm",
  ".md"
]
[[content_categories]]
name = "games"
description = "Game launchers, game protocol links, and common game library paths"
patterns = [
  "steam://*",
  "uplay://*",
  "origin://*",
  '*\games\*',
  "*ubisoft*",
  "*electronicarts*",
  "*battle.net*",
  "googleplaygames://*",
  "*play games*",
  "*epic games*",
  "*gog galaxy*",
  "*gamecenter*",
]

[[content_categories]]
name = "microsoft-autogenerated"
description = "Microsoft.AutoGenerated search/index entries"
patterns = [
  "*microsoft.autogenerated*"
]

[[content_categories]]
name = "microsoft"
description = "Any app, path or URL containing Microsoft"
patterns = [
  "*microsoft*"
]
disabled_by_default = true
